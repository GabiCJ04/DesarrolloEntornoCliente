<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscripción · Gabriel Cruz Jiménez</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container">
      <span class="navbar-brand">Gabriel Cruz Jiménez</span>
      <span class="navbar-text">Tarea 8 · DWEC</span>
    </div>
  </nav>
  <main class="container py-4">
    <h1>Jornadas de Desarrollo Web 2026</h1>
    <p>Formulario de inscripción. Los campos con * son obligatorios.</p>
    <form id="inscripcion" action="recibido.html" method="get">
      <fieldset class="mb-4">
        <legend class="fs-5 border-bottom pb-1">Tus datos</legend>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre y apellidos *</label>
          <input type="text" class="form-control" id="nombre" name="nombre" autocomplete="name"
                 required minlength="3" maxlength="60" pattern="[A-Za-zÁÉÍÓÚÜáéíóúüÑñ\- ]+"
                 title="Entre 3 y 60 caracteres. Usa letras, espacios o guiones."
                 aria-describedby="errorNombre">
          <div id="errorNombre" class="invalid-feedback"></div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="email" class="form-label">Correo electrónico *</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email"
                   required aria-describedby="errorEmail">
            <div id="errorEmail" class="invalid-feedback"></div>
          </div>
          <div class="col-md-6 mb-3">
            <label for="email2" class="form-label">Repite el correo *</label>
            <input type="email" class="form-control" id="email2" autocomplete="email"
                   required aria-describedby="errorEmail2">
            <div id="errorEmail2" class="invalid-feedback"></div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="telefono" class="form-label">Teléfono (opcional)</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" autocomplete="tel"
                   pattern="[0-9]{9}" title="Introduce nueve cifras sin espacios."
                   aria-describedby="errorTelefono">
            <div id="errorTelefono" class="invalid-feedback"></div>
          </div>
          <div class="col-md-6 mb-3">
            <label for="nacimiento" class="form-label">Fecha de nacimiento *</label>
            <input type="date" class="form-control" id="nacimiento" name="nacimiento" autocomplete="bday"
                   min="1940-01-01" max="2010-12-31" required
                   title="Elige una fecha entre el 01/01/1940 y el 31/12/2010."
                   aria-describedby="errorNacimiento">
            <div id="errorNacimiento" class="invalid-feedback"></div>
          </div>
        </div>
      </fieldset>
    </form>
  </main>
  <footer class="border-top py-3">
    <div class="container">Gabriel Cruz Jiménez · DWEC 26/27</div>
  </footer>
</body>
</html>
